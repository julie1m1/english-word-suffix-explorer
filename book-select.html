<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocab Lab Omni · Word Shelf</title>
  <script>
    /* 与 dashboard2 同规则：仅当从未手动切过主题时默认浅色，
       已存过偏好（含 dark）一律尊重 */
    try { if (!localStorage.getItem("vocab-theme")) localStorage.setItem("vocab-theme", "light"); } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='12' rx='3' fill='%23D0BCFF'/><rect x='18' y='2' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.6'/><rect x='2' y='18' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.6'/><rect x='18' y='18' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- M3 令牌 / Hero 色块 / 胶囊导航 / 铺满宽度全部复用 dashboard2.css -->
  <link rel="stylesheet" href="dashboard2.css" />
  <style>
    /* ── 分类区块（Hero 下方的排列区，宽度由 .dash-main 铺满） ── */
    .category { margin-bottom: 40px; scroll-margin-top: clamp(14px, 2vw, 28px); }
    .category-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding: 0 2px;
    }
    .category-name {
      font-family: "DM Sans", sans-serif;
      font-weight: 700; font-size: clamp(18px, 1.6vw, 24px);
      letter-spacing: -.01em; line-height: 1.1;
      color: var(--text-1);
    }
    .category-count {
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: var(--md-tonal-spot);
      padding: 2px 8px; border-radius: 6px;
    }
    .category-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Book grid（book-cover shapes, 纯色封面） ── */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 26px 22px;
    }

    /* ── Book Card = a standing book ── */
    .book-card {
      position: relative;
      display: block;
      aspect-ratio: 3 / 4;
      border-radius: 3px 11px 11px 3px;
      /* 纯色为底，只在底部叠 8% 的轻微明暗过渡（不再是双色渐变） */
      background: linear-gradient(165deg, var(--c) 0%, color-mix(in srgb, var(--c) 92%, #000) 100%);
      color: var(--book-ink);
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--book-shadow);
      transition: transform .28s cubic-bezier(.34,1.4,.5,1), box-shadow .28s, filter .28s;
      isolation: isolate;
    }
    /* spine */
    .book-card::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
      background: var(--book-spine);
      border-right: 1px solid var(--book-spine-border);
      z-index: 2;
    }
    /* soft sheen across the cover */
    .book-card::after {
      content: "";
      position: absolute; inset: 0;
      background: var(--book-sheen);
      z-index: 1;
      pointer-events: none;
    }
    .book-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      filter: saturate(1.08) brightness(1.04);
      box-shadow: var(--book-shadow-hover);
    }
    .book-card:active { transform: translateY(-2px) scale(.99); }

    .book-inner {
      position: relative; z-index: 3;
      height: 100%;
      padding: 22px 16px 18px 26px;
      display: flex; flex-direction: column;
      text-shadow: var(--book-text-shadow);
    }
    .book-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--book-ink-soft);
      margin-bottom: auto;
      display: flex; align-items: center; gap: 5px;
    }
    .book-tag .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--book-ink-soft);
    }
    .book-title {
      font-size: 17px; font-weight: 700; line-height: 1.28;
      letter-spacing: -.3px;
      color: var(--book-ink);
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-foot { margin-top: 12px; display: flex; align-items: center; }
    .book-total {
      margin-bottom: 4px;
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      color: var(--book-ink-soft); opacity: .75;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .book-open {
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      color: var(--book-ink-soft);
      display: inline-flex; align-items: center; gap: 5px;
      transform: translateX(-4px); opacity: 0;
      transition: transform .28s, opacity .28s;
    }
    .book-card:hover .book-open { transform: translateX(0); opacity: .9; }

    /* ── 书本封面专用 token（dashboard2.css 没有这组，本页补充） ── */
    :root, [data-theme="dark"] {
      --book-ink: #ffffff;
      --book-ink-soft: rgba(255,255,255,.85);
      --book-text-shadow: 0 1px 3px rgba(0,0,0,.30);
      --book-spine: linear-gradient(180deg, rgba(255,255,255,.28), rgba(0,0,0,.30));
      --book-spine-border: rgba(255,255,255,.22);
      --book-sheen: linear-gradient(115deg, rgba(255,255,255,.16) 0%, transparent 42%);
      --book-shadow: 4px 3px 0 -1px rgba(255,255,255,.30), 8px 7px 0 -1px rgba(0,0,0,.18), 0 16px 38px rgba(0,0,0,.42);
      --book-shadow-hover: 4px 3px 0 -1px rgba(255,255,255,.34), 10px 12px 0 -1px rgba(0,0,0,.20), 0 26px 54px rgba(0,0,0,.5);
    }
    [data-theme="light"] {
      --book-ink: #241b3a;
      --book-ink-soft: rgba(36,27,58,.72);
      --book-text-shadow: 0 1px 2px rgba(255,255,255,.45);
      --book-spine: linear-gradient(180deg, rgba(255,255,255,.55), rgba(0,0,0,.16));
      --book-spine-border: rgba(255,255,255,.5);
      --book-sheen: linear-gradient(115deg, rgba(255,255,255,.4) 0%, transparent 46%);
      --book-shadow: 4px 3px 0 -1px rgba(255,255,255,.7), 8px 7px 0 -1px rgba(20,16,40,.10), 0 16px 34px rgba(20,16,40,.14);
      --book-shadow-hover: 4px 3px 0 -1px rgba(255,255,255,.8), 10px 12px 0 -1px rgba(20,16,40,.10), 0 26px 50px rgba(20,16,40,.20);
    }

    /* ── Loading / empty ── */
    .loading { text-align: center; padding: 80px 20px; color: var(--text-3); font-size: 14px; }
    .loading::after {
      content: ""; display: block;
      width: 28px; height: 28px; margin: 16px auto 0;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-result { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 14px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .book-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 22px 16px;
      }
      .book-inner { padding: 18px 12px 14px 24px; }
      .book-title { font-size: 15px; }
    }
  </style>
</head>
<body class="dash-body">
  <!-- ══ Hero 大色块：与 dashboard2 同款（标题 + 副标题 + 分类胶囊导航 + 统计 + 右上角入口） ══ -->
  <header class="dash-hero" role="banner">
    <div class="dash-hero-actions">
      <a class="theme-btn" href="index.html" title="Back to word browser" aria-label="Back to word browser">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="m15.9 8.1-2.2 5.6-5.6 2.2 2.2-5.6 5.6-2.2Z"/></svg>
      </a>
      <a class="theme-btn" href="dashboard2.html" title="Learning stats" aria-label="Learning stats">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
      </a>
      <button class="theme-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
      </button>
    </div>

    <h1 class="dash-hero-title">Word Shelf</h1>
    <p class="dash-hero-sub">Every word book in the library, grouped by category on one page. Pick a category chip to jump straight to it, then tap a cover to start today's study.</p>

    <!-- 分类胶囊导航：数据加载后生成 -->
    <nav class="dash-hero-nav" id="catNav" aria-label="Categories"></nav>

    <!-- 统计条：Hero 底部纯文字概览（与 dashboard2 同款） -->
    <div class="dash-hero-stats">
      <div class="dash-seg dash-seg-stat">
        <span class="dash-seg-label">Categories</span>
        <span class="dash-seg-num" id="statCats">—</span>
      </div>
      <div class="dash-seg dash-seg-stat">
        <span class="dash-seg-label">Word books</span>
        <span class="dash-seg-num" id="statBooks">—</span>
      </div>
    </div>
  </header>

  <!-- ══ 排列区：分类 + 书本网格（dash-main 铺满至 1900px） ══ -->
  <main class="dash-main" aria-label="Book categories">
    <div id="content">
      <div class="loading">Loading</div>
    </div>
  </main>

  <script>
    /* ══ 书封配色：沿用现有色板，纯色取每对的第一个色 ══
       dark = 饱和宝石色，light = 浅冷色 */
    const DARK_PALETTE = [
      ["#7C3AED", "#C026D3"], ["#6D28D9", "#3B82F6"], ["#2563EB", "#06B6D4"],
      ["#0891B2", "#0EA5E9"], ["#DB2777", "#9333EA"], ["#4F46E5", "#8B5CF6"],
      ["#0EA5E9", "#6366F1"], ["#8B5CF6", "#EC4899"], ["#14B8A6", "#3B82F6"],
      ["#A855F7", "#6366F1"], ["#F43F5E", "#A855F7"], ["#22D3EE", "#4F46E5"],
      ["#6366F1", "#A855F7"], ["#0D9488", "#22D3EE"]
    ];
    const LIGHT_PALETTE = [
      ["#C4B5FD", "#E9D5FF"], ["#A5B4FC", "#C7D2FE"], ["#93C5FD", "#BFDBFE"],
      ["#7DD3FC", "#BAE6FD"], ["#5EEAD4", "#99F6E4"], ["#FBCFE8", "#F9A8D4"],
      ["#DDD6FE", "#EDE9FE"], ["#A7F3EB", "#CFFAFE"], ["#F5D0FE", "#FBCFE8"],
      ["#BFDBFE", "#DBEAFE"], ["#C7D2FE", "#E0E7FF"], ["#FBCFE8", "#FEC8E8"],
      ["#B5E8FC", "#DDF3FE"], ["#E9D5FF", "#F3E8FF"]
    ];
    const order = Array.from({ length: Math.max(DARK_PALETTE.length, LIGHT_PALETTE.length) }, (_, i) => i)
      .sort(() => Math.random() - 0.5);
    let assignIdx = 0;
    function nextPair() {
      const i = order[assignIdx % order.length];
      assignIdx++;
      return {
        dark: DARK_PALETTE[i % DARK_PALETTE.length][0],
        light: LIGHT_PALETTE[i % LIGHT_PALETTE.length][0]
      };
    }
    function applyBookColors(theme) {
      const key = theme === "light" ? "light" : "dark";
      document.querySelectorAll(".book-card").forEach(card => {
        const c = card.dataset[key];
        if (c) card.style.setProperty("--c", c);
      });
    }

    /* ══ Theme ══ */
    const THEME_KEY = "vocab-theme";
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem(THEME_KEY, t);
      const sunSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>';
      const moonSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>';
      document.getElementById("themeToggle").innerHTML = t === "light" ? moonSvg : sunSvg;
      applyBookColors(t);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    document.getElementById("themeToggle").addEventListener("click", () => {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    /* ══ Data ══ */
    let categories = [];
    let bookCounts = {};

    Promise.all([
      fetch("data/list.json").then(r => r.json()),
      fetch("data/book_counts.json").then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ])
      .then(([data, counts]) => {
        bookCounts = counts;
        let cur = { name: "", books: [] };
        data.vocabs.forEach(n => {
          if (n === "---") return;
          if (n.endsWith(".csv")) {
            cur.books.push(n);
          } else {
            if (cur.books.length) categories.push(cur);
            cur = { name: n, books: [] };
          }
        });
        if (cur.books.length) categories.push(cur);

        const totalBooks = categories.reduce((s, c) => s + c.books.length, 0);
        document.getElementById("statCats").textContent = categories.length;
        document.getElementById("statBooks").textContent = totalBooks;

        render();
      })
      .catch(() => {
        document.getElementById("content").innerHTML = '<div class="no-result">Unable to load the book list</div>';
      });

    function render() {
      const content = document.getElementById("content");
      const nav = document.getElementById("catNav");
      content.innerHTML = "";
      nav.innerHTML = "";
      const theme = document.documentElement.getAttribute("data-theme");

      categories.forEach((cat, ci) => {
        const section = document.createElement("div");
        section.className = "category";
        section.id = "cat-" + ci;

        const head = document.createElement("div");
        head.className = "category-head";
        head.innerHTML =
          `<span class="category-name">${esc(cat.name)}</span>` +
          `<span class="category-count">${cat.books.length}</span>` +
          `<span class="category-line"></span>`;
        section.appendChild(head);

        const grid = document.createElement("div");
        grid.className = "book-grid";

        cat.books.forEach(book => {
          const pair = nextPair();
          const card = document.createElement("a");
          card.className = "book-card";
          card.href = "index.html";
          card.dataset.dark = pair.dark;
          card.dataset.light = pair.light;
          card.style.setProperty("--c", theme === "light" ? pair.light : pair.dark);
          const count = bookCounts[book];
          card.innerHTML =
            `<div class="book-inner">` +
              `<div class="book-tag"><span class="dot"></span>${esc(cat.name)}</div>` +
              (count ? `<div class="book-total">Total: ${count.toLocaleString()} words</div>` : "") +
              `<div class="book-title">${esc(book.replace(".csv",""))}</div>` +
              `<div class="book-foot">` +
                `<span class="book-open">Open →</span>` +
              `</div>` +
            `</div>`;
          card.addEventListener("click", e => {
            e.preventDefault();
            localStorage.setItem("vocab-selected-book", "data/" + book);
            window.location.href = "index.html";
          });
          grid.appendChild(card);
        });

        section.appendChild(grid);
        content.appendChild(section);

        const chip = document.createElement("a");
        chip.className = "dash-chip";
        chip.href = "#cat-" + ci;
        chip.textContent = cat.name;
        nav.appendChild(chip);
      });
    }

    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
