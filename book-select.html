<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocab Lab · Bookshelf</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='12' rx='3' fill='%23D0BCFF'/><rect x='18' y='2' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.6'/><rect x='2' y='18' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.6'/><rect x='18' y='18' width='12' height='12' rx='3' fill='%23D0BCFF' opacity='.3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══ MATERIAL DESIGN 3 — DARK THEME（与 dashboard / index 一致） ══ */
    :root,
    [data-theme="dark"] {
      --md-primary: #d0bcff;
      --md-on-primary: #381e72;
      --md-primary-container: #4f378b;
      --md-on-primary-container: #eaddff;
      --md-secondary: #ccc2dc;
      --md-tertiary: #efb8c8;
      --md-surface: #1c1b1f;
      --md-surface-1: #28272c;
      --md-surface-2: #312f38;
      --md-surface-3: #3a3741;
      --md-on-surface: #e6e1e5;
      --md-on-surface-var: #cac4d0;
      --md-outline: #938f99;
      --md-outline-var: rgba(147, 143, 153, 0.18);
      --md-error: #f2b8b8;
      --md-tonal-spot: rgba(208, 188, 255, 0.12);
      --md-scrim: rgba(0, 0, 0, 0.4);

      --bg: var(--md-surface);
      --surface: var(--md-surface-1);
      --surface-2: var(--md-surface-2);
      --surface-hover: rgba(208, 188, 255, 0.08);
      --border: var(--md-outline-var);
      --accent: var(--md-primary);
      --accent-2: #b794f6;
      --text-1: var(--md-on-surface);
      --text-2: var(--md-on-surface-var);
      --text-3: var(--md-outline);
      --glow: rgba(208, 188, 255, 0.12);
      --nav-bg: rgba(28,27,31,.72);
      --glass: rgba(255,255,255,.03);
      --glass-border: var(--md-outline-var);
      --gradient-1: linear-gradient(135deg, #d0bcff 0%, #9f7aea 50%, #764ba2 100%);
      --gradient-2: rgba(208,188,255,.08);
      --shadow: rgba(0,0,0,.45);

      /* ── 书封（dark 模式：第一版饱和宝石色 + 白字） ── */
      --book-ink: #ffffff;
      --book-ink-soft: rgba(255,255,255,.85);
      --book-text-shadow: 0 1px 3px rgba(0,0,0,.30);
      --book-spine: linear-gradient(180deg, rgba(255,255,255,.28), rgba(0,0,0,.30));
      --book-spine-border: rgba(255,255,255,.22);
      --book-sheen: linear-gradient(115deg, rgba(255,255,255,.16) 0%, transparent 42%);
      --book-shadow: 4px 3px 0 -1px rgba(255,255,255,.30), 8px 7px 0 -1px rgba(0,0,0,.18), 0 16px 38px rgba(0,0,0,.42);
      --book-shadow-hover: 4px 3px 0 -1px rgba(255,255,255,.34), 10px 12px 0 -1px rgba(0,0,0,.20), 0 26px 54px rgba(0,0,0,.5);
    }

    /* ══ MATERIAL DESIGN 3 — LIGHT THEME（与 dashboard / index 一致） ══ */
    [data-theme="light"] {
      --md-primary: #6750a4;
      --md-on-primary: #ffffff;
      --md-primary-container: #eaddff;
      --md-on-primary-container: #21005d;
      --md-secondary: #625b71;
      --md-tertiary: #7d5260;
      --md-surface: #fffbfe;
      --md-surface-1: #f7f2fa;
      --md-surface-2: #f3edf7;
      --md-surface-3: #ede8f5;
      --md-on-surface: #1c1b1f;
      --md-on-surface-var: #49454f;
      --md-outline: #79747e;
      --md-outline-var: rgba(121, 116, 126, 0.14);
      --md-error: #b3261e;
      --md-tonal-spot: rgba(103, 80, 164, 0.1);
      --md-scrim: rgba(0, 0, 0, 0.25);

      --bg: var(--md-surface);
      --surface: var(--md-surface-1);
      --surface-2: var(--md-surface-2);
      --surface-hover: rgba(103,80,164,.08);
      --border: var(--md-outline-var);
      --accent: var(--md-primary);
      --accent-2: #7c3aed;
      --text-1: var(--md-on-surface);
      --text-2: var(--md-on-surface-var);
      --text-3: var(--md-outline);
      --glow: rgba(103,80,164,.12);
      --nav-bg: rgba(255,251,254,.78);
      --glass: rgba(255,255,255,.6);
      --glass-border: var(--md-outline-var);
      --gradient-1: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #764ba2 100%);
      --gradient-2: rgba(103,80,164,.1);
      --shadow: rgba(103,80,164,.12);

      /* 书封：浅冷色 + 深字 */
      --book-ink: #241b3a;
      --book-ink-soft: rgba(36,27,58,.72);
      --book-text-shadow: 0 1px 2px rgba(255,255,255,.45);
      --book-spine: linear-gradient(180deg, rgba(255,255,255,.55), rgba(0,0,0,.16));
      --book-spine-border: rgba(255,255,255,.5);
      --book-sheen: linear-gradient(115deg, rgba(255,255,255,.4) 0%, transparent 46%);
      --book-shadow: 4px 3px 0 -1px rgba(255,255,255,.7), 8px 7px 0 -1px rgba(20,16,40,.10), 0 16px 34px rgba(20,16,40,.14);
      --book-shadow-hover: 4px 3px 0 -1px rgba(255,255,255,.8), 10px 12px 0 -1px rgba(20,16,40,.10), 0 26px 50px rgba(20,16,40,.20);
    }

    html {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
      /* 弱化系统滚动条（Firefox） */
      scrollbar-width: thin;
      scrollbar-color: var(--md-outline) transparent;
    }

    /* ── 弱化右侧滚动条（WebKit）：极细、半透明、留白边 ── */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--md-outline-var);
      border-radius: 8px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-3);
      background-clip: content-box;
    }
    ::-webkit-scrollbar-corner { background: transparent; }

    body {
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }

    /* ── Ambient background ── */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bg-glow::before {
      content: "";
      position: absolute;
      width: 600px; height: 600px;
      top: -200px; left: -100px;
      background: radial-gradient(circle, rgba(183,148,246,.08) 0%, transparent 70%);
      animation: float 20s ease-in-out infinite;
    }
    .bg-glow::after {
      content: "";
      position: absolute;
      width: 500px; height: 500px;
      bottom: -150px; right: -100px;
      background: radial-gradient(circle, rgba(102,126,234,.06) 0%, transparent 70%);
      animation: float 25s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 30px); }
    }

    /* ══ NAVBAR（与 dashboard 同款：吸顶 + 毛玻璃） ══ */
    .dash-navbar {
      position: sticky; top: 0; z-index: 101;
      width: 100%; height: 48px;
      display: flex; align-items: center;
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--glass-border);
      background: var(--nav-bg);
      transition: background-color .2s ease;
    }
    .dash-navbar-inner {
      width: 100%; max-width: 1040px; margin: 0 auto;
      padding: 0 24px; height: 100%;
      display: flex; align-items: center; gap: 16px;
    }
    .dash-navbar-brand { display: flex; align-items: center; gap: 10px; }
    .dash-navbar-logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: #E9D5FF;            /* 与 dashboard 一致的浅紫容器 */
      color: #6D28D9;                /* 与 dashboard 一致的深紫方块 */
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .dash-navbar-logo svg { width: 16px; height: 16px; }
    .dash-navbar-text { display: flex; flex-direction: column; line-height: 1.15; }
    .dash-navbar-text h2 {
      font-family: "Fraunces", serif;   /* 与 dashboard 一致 */
      font-style: italic; font-weight: 300;
      font-size: 17px; letter-spacing: -.2px;
      color: var(--text-1); margin: 0;
    }
    .dash-navbar-text span {
      font-size: 10px; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
    }
    .nav-stats { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .nav-stat {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface);
      white-space: nowrap;
    }
    .nav-stat-label { font-size: 11px; color: var(--text-3); font-weight: 500; }
    .nav-stat-num {
      font-size: 13px; font-weight: 700; color: var(--text-1);
      font-variant-numeric: tabular-nums;
    }
    .dash-navbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    .theme-btn {
      height: 34px; width: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; text-decoration: none;
      border-radius: 8px !important;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      transition: all .2s; cursor: pointer;
    }
    .theme-btn svg { vertical-align: middle; flex-shrink: 0; }
    .theme-btn:hover { background: var(--surface-hover); border-color: var(--accent); color: var(--accent); }

    /* ── Layout ── */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 1040px; margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Hero ── */
    .hero {
      padding: 56px 0 36px;
      text-align: center;
    }
    .hero .nav-stats { margin-bottom: 20px; }
    .hero h1 {
      font-size: 38px; font-weight: 700; letter-spacing: -1px;
      line-height: 1.15; margin-bottom: 14px;
      background: linear-gradient(135deg, var(--text-1) 0%, var(--text-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 16px; color: var(--text-2); max-width: 460px;
      margin: 0 auto; line-height: 1.7;
    }

    /* ── Category ── */
    .category { margin-bottom: 44px; }
    .category-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px; padding: 0 4px;
    }
    .category-name {
      font-size: 14px; font-weight: 700; color: var(--text-1);
      letter-spacing: -.2px;
    }
    .category-count {
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: var(--md-tonal-spot);
      padding: 2px 8px; border-radius: 6px;
    }
    .category-line { flex: 1; height: 1px; background: var(--glass-border); }

    /* ── Book grid (book-cover shapes) ── */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 26px 22px;
    }

    /* ── Book Card = a standing book ── */
    .book-card {
      position: relative;
      display: block;
      aspect-ratio: 3 / 4;
      border-radius: 3px 11px 11px 3px;
      background: linear-gradient(150deg, var(--c1) 0%, var(--c2) 100%);
      color: var(--book-ink);
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      box-shadow: var(--book-shadow);
      transition: transform .28s cubic-bezier(.34,1.4,.5,1), box-shadow .28s, filter .28s;
      isolation: isolate;
    }
    /* spine */
    .book-card::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
      background: var(--book-spine);
      border-right: 1px solid var(--book-spine-border);
      z-index: 2;
    }
    /* soft sheen across the cover */
    .book-card::after {
      content: "";
      position: absolute; inset: 0;
      background: var(--book-sheen);
      z-index: 1;
      pointer-events: none;
    }
    .book-card:hover {
      transform: translateY(-8px) rotate(-1deg);
      filter: saturate(1.08) brightness(1.04);
      box-shadow: var(--book-shadow-hover);
    }
    .book-card:active { transform: translateY(-2px) scale(.99); }

    .book-inner {
      position: relative; z-index: 3;
      height: 100%;
      padding: 22px 16px 18px 26px;
      display: flex; flex-direction: column;
      text-shadow: var(--book-text-shadow);
    }
    .book-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--book-ink-soft);
      margin-bottom: auto;
      display: flex; align-items: center; gap: 5px;
    }
    .book-tag .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--book-ink-soft);
    }
    .book-title {
      font-size: 17px; font-weight: 700; line-height: 1.28;
      letter-spacing: -.3px;
      color: var(--book-ink);
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-foot { margin-top: 12px; display: flex; align-items: center; }
    .book-total {
      margin-bottom: 4px;
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      color: var(--book-ink-soft); opacity: .75;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .book-open {
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      color: var(--book-ink-soft);
      display: inline-flex; align-items: center; gap: 5px;
      transform: translateX(-4px); opacity: 0;
      transition: transform .28s, opacity .28s;
    }
    .book-card:hover .book-open { transform: translateX(0); opacity: .9; }

    /* ── 左侧极简固定导航：平时只显小刻度，当前/悬停才显文字 ── */
    .cat-rail {
      display: none;
      position: fixed;
      left: 22px; top: 50%; transform: translateY(-50%);
      z-index: 90;
      flex-direction: column;
      max-height: 76vh;
    }
    .cat-rail a {
      position: relative;
      display: flex; align-items: center;
      padding: 7px 0;
      text-decoration: none;
    }
    .cat-rail .tick {
      width: 14px; height: 2px; border-radius: 2px;
      background: var(--text-3); opacity: .32;
      transition: width .25s, background .25s, opacity .25s;
    }
    .cat-rail a:hover .tick { opacity: .6; }
    .cat-rail a.active .tick { width: 26px; background: var(--accent); opacity: 1; }
    .cat-rail .lbl {
      position: absolute; left: calc(100% + 12px); top: 50%;
      transform: translateY(-50%) translateX(-6px);
      white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      font-size: 12px; font-weight: 600; color: var(--text-1);
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      padding: 4px 10px; border-radius: 8px;
      border: 1px solid var(--glass-border);
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .cat-rail a:hover .lbl { opacity: 1; transform: translateY(-50%) translateX(0); }
    @media (min-width: 1200px) { .cat-rail { display: flex; } }

    /* ── Loading ── */
    .loading { text-align: center; padding: 80px 20px; color: var(--text-3); font-size: 14px; }
    .loading::after {
      content: ""; display: block;
      width: 28px; height: 28px; margin: 16px auto 0;
      border: 2px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-result { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 14px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .dash-navbar-inner { gap: 10px; padding: 0 16px; }
      .dash-navbar-text span { display: none; }
      .hero { padding: 40px 0 28px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; }
      .book-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 22px 16px;
      }
      .book-inner { padding: 18px 12px 14px 24px; }
      .book-title { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- ══ Navbar（与 dashboard 同款；状态 = Bookshelf；统计挂在品牌后） ══ -->
  <nav class="dash-navbar" role="navigation">
    <div class="dash-navbar-inner">
      <div class="dash-navbar-brand">
        <div class="dash-navbar-logo">
          <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="6" height="6" rx="2" fill="currentColor"/>
            <rect x="10" y="2" width="6" height="6" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="2" y="10" width="6" height="6" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="10" y="10" width="6" height="6" rx="2" fill="currentColor" opacity=".3"/>
          </svg>
        </div>
        <div class="dash-navbar-text">
          <h2>Vocab Lab</h2>
          <span>Bookshelf</span>
        </div>

      <div class="dash-navbar-actions">
        <a class="theme-btn" href="index.html" title="返回单词浏览器" aria-label="返回主页">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="m15.9 8.1-2.2 5.6-5.6 2.2 2.2-5.6 5.6-2.2Z"/></svg>

      </div>

  </nav>

  <!-- ══ 左侧分类固定导航（滚动高亮 + 点击跳转，render 时生成） ══ -->
  <nav class="cat-rail" id="catRail" aria-label="分类导航"></nav>

  <div class="wrapper">
    <!-- Hero -->
    <div class="hero">
      <div class="nav-stats">
        <div class="nav-stat">
          <span class="nav-stat-label">分类</span>
          <span class="nav-stat-num" id="statCats">—</span>
        </div>
        <div class="nav-stat">
          <span class="nav-stat-label">单词书</span>
          <span class="nav-stat-num" id="statBooks">—</span>
        </div>
      </div>
      <h1>挑一本单词书，开始今天的学习</h1>
      <p>从下方分类里选一本，翻开就能背 —— 让每天的记忆都有个轻松的开始。</p>
    </div>

    <!-- Content -->
    <div id="content">
      <div class="loading">Loading</div>
    </div>
  </div>

  <script>
    /* ══ 书封配色：dark = 第一版饱和宝石色；light = 浅冷色 ══ */
    const DARK_PALETTE = [
      ["#7C3AED", "#C026D3"], // violet → fuchsia
      ["#6D28D9", "#3B82F6"], // indigo → blue
      ["#2563EB", "#06B6D4"], // blue → cyan
      ["#0891B2", "#0EA5E9"], // teal → sky
      ["#DB2777", "#9333EA"], // pink → purple
      ["#4F46E5", "#8B5CF6"], // indigo → violet
      ["#0EA5E9", "#6366F1"], // sky → indigo
      ["#8B5CF6", "#EC4899"], // purple → pink
      ["#14B8A6", "#3B82F6"], // teal → blue
      ["#A855F7", "#6366F1"], // purple → indigo
      ["#F43F5E", "#A855F7"], // rose → purple
      ["#22D3EE", "#4F46E5"], // cyan → indigo
      ["#6366F1", "#A855F7"], // indigo → purple
      ["#0D9488", "#22D3EE"]  // teal → cyan
    ];
    const LIGHT_PALETTE = [
      ["#C4B5FD", "#E9D5FF"],
      ["#A5B4FC", "#C7D2FE"],
      ["#93C5FD", "#BFDBFE"],
      ["#7DD3FC", "#BAE6FD"],
      ["#5EEAD4", "#99F6E4"],
      ["#FBCFE8", "#F9A8D4"],
      ["#DDD6FE", "#EDE9FE"],
      ["#A7F3EB", "#CFFAFE"],
      ["#F5D0FE", "#FBCFE8"],
      ["#BFDBFE", "#DBEAFE"],
      ["#C7D2FE", "#E0E7FF"],
      ["#FBCFE8", "#FEC8E8"],
      ["#B5E8FC", "#DDF3FE"],
      ["#E9D5FF", "#F3E8FF"]
    ];
    const order = Array.from({ length: Math.max(DARK_PALETTE.length, LIGHT_PALETTE.length) }, (_, i) => i)
      .sort(() => Math.random() - 0.5);
    let assignIdx = 0;
    function nextPair() {
      const i = order[assignIdx % order.length];
      assignIdx++;
      return {
        dark: DARK_PALETTE[i % DARK_PALETTE.length],
        light: LIGHT_PALETTE[i % LIGHT_PALETTE.length]
      };
    }
    function applyBookColors(theme) {
      const key = theme === "light" ? "light" : "dark";
      document.querySelectorAll(".book-card").forEach(card => {
        const raw = card.dataset[key];
        if (!raw) return;
        const [c1, c2] = raw.split(",");
        card.style.setProperty("--c1", c1);
        card.style.setProperty("--c2", c2);
      });
    }

    /* ══ Theme ══ */
    const THEME_KEY = "vocab-theme";
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem(THEME_KEY, t);
      const sunSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>';
      const moonSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>';
      document.getElementById("themeToggle").innerHTML = t === "light" ? moonSvg : sunSvg;
      applyBookColors(t);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    document.getElementById("themeToggle").addEventListener("click", () => {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    /* ══ Data ══ */
    let categories = [];
    let bookCounts = {};

    Promise.all([
      fetch("data/list.json").then(r => r.json()),
      fetch("data/book_counts.json").then(r => r.ok ? r.json() : {}).catch(() => ({}))
    ])
      .then(([data, counts]) => {
        bookCounts = counts;
        let cur = { name: "", books: [] };
        data.vocabs.forEach(n => {
          if (n === "---") return;
          if (n.endsWith(".csv")) {
            cur.books.push(n);
          } else {
            if (cur.books.length) categories.push(cur);
            cur = { name: n, books: [] };
          }
        });
        if (cur.books.length) categories.push(cur);

        const totalBooks = categories.reduce((s, c) => s + c.books.length, 0);
        document.getElementById("statCats").textContent = categories.length;
        document.getElementById("statBooks").textContent = totalBooks;

        render();
      })
      .catch(() => {
        document.getElementById("content").innerHTML = '<div class="no-result">无法加载词库列表</div>';
      });

    function render() {
      const content = document.getElementById("content");
      content.innerHTML = "";
      const rail = document.getElementById("catRail");
      rail.innerHTML = "";
      const theme = document.documentElement.getAttribute("data-theme");

      categories.forEach((cat, ci) => {
        const section = document.createElement("div");
        section.className = "category";
        section.id = "cat-" + ci;
        section.style.scrollMarginTop = "70px";

        const head = document.createElement("div");
        head.className = "category-head";
        head.innerHTML =
          `<span class="category-name">${esc(cat.name)}</span>` +
          `<span class="category-count">${cat.books.length}</span>` +
          `<span class="category-line"></span>`;
        section.appendChild(head);

        const grid = document.createElement("div");
        grid.className = "book-grid";

        cat.books.forEach(book => {
          const pair = nextPair();
          const col = theme === "light" ? pair.light : pair.dark;
          const card = document.createElement("a");
          card.className = "book-card";
          card.href = "index.html";
          card.dataset.dark = pair.dark.join(",");
          card.dataset.light = pair.light.join(",");
          card.style.setProperty("--c1", col[0]);
          card.style.setProperty("--c2", col[1]);
          const count = bookCounts[book];
          card.innerHTML =
            `<div class="book-inner">` +
              `<div class="book-tag"><span class="dot"></span>${esc(cat.name)}</div>` +
              (count ? `<div class="book-total">Total: ${count.toLocaleString()} words</div>` : "") +
              `<div class="book-title">${esc(book.replace(".csv",""))}</div>` +
              `<div class="book-foot">` +
                `<span class="book-open">打开 →</span>` +
              `</div>` +
            `</div>`;
          card.addEventListener("click", e => {
            e.preventDefault();
            localStorage.setItem("vocab-selected-book", "data/" + book);
            window.location.href = "index.html";
          });
          grid.appendChild(card);
        });

        section.appendChild(grid);
        content.appendChild(section);

        const link = document.createElement("a");
        link.href = "#cat-" + ci;
        link.title = cat.name;
        link.innerHTML = `<span class="tick"></span><span class="lbl">${esc(cat.name)}</span>`;
        rail.appendChild(link);
      });

      setupRailSpy();
    }

    /* 滚动 → 高亮当前分类；点击 → 平滑跳转 */
    function setupRailSpy() {
      const sections = Array.from(document.querySelectorAll(".category"));
      const links = Array.from(document.querySelectorAll("#catRail a"));
      if (!sections.length) return;

      function onScroll() {
        const y = window.scrollY + 120;
        let idx = 0;
        for (let i = 0; i < sections.length; i++) {
          if (sections[i].offsetTop <= y) idx = i;
        }
        if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) {
          idx = sections.length - 1;
        }
        links.forEach((l, i) => l.classList.toggle("active", i === idx));
      }

      links.forEach((l, i) => {
        l.addEventListener("click", e => {
          e.preventDefault();
          sections[i].scrollIntoView({ behavior: "smooth", block: "start" });
          history.replaceState(null, "", "#cat-" + i);
        });
      });

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
    }

    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
